stage: phase4_probability_calibration

inputs:
  base_predictions_csv: results_v2/base_model_predictions.csv

calibration:
  primary_method: platt_logit
  isotonic_sensitivity_analysis: true
  probability_clip: 0.000001
  adaptive_ece_bins: 10
  platt:
    solver: lbfgs
    C: 1000000.0
    max_iter: 1000

outputs:
  calibrated_predictions_csv: results_v2/calibrated_base_model_predictions.csv
  calibration_metrics_csv: results_v2/calibration_metrics.csv
  calibration_fit_audit_csv: results_v2/calibration_fit_audit.csv
  reliability_figure_stem: results_v2/figures/phase4_reliability_outer_test
  metadata_json: results_v2/phase4_calibration_metadata.json
